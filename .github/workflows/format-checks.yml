# This workflow verifies files are properly formatted.

name: Run format checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # This job validates that mapfile.csv is correctly formatted and configured.
  verify-mapfile:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ github.workspace }}/scripts/ci/verify_mapfile

    steps:
    - name: Checkout perfmon
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

    - name: Set up Python 3.x
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
      with:
        python-version: "3.x"

    - name: Install Python packages
      run: pip install -r requirements.txt

    - name: Run verify_mapfile self tests
      run: python -m unittest

    - name: Validate mapfile.csv
      run: python verify_mapfile.py

  # This job runs csvlinter to validate CSV file formatting.
  csvlinter:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout perfmon
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

    - uses: csvlinter/csvlinter-action@eb248038c8222e82b83f9585233f308780c2147b # v1.0.1
      with:
        paths: "scripts/config/perf-uncore-events-*.csv"
